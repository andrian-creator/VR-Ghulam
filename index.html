<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Frame VR Showcase - HOP JUMP 3D Experience</title>
  <meta name="description" content="Interaktif WebVR Showcase untuk 3D Model HOP JUMP menggunakan A-Frame 3D engine.">
  
  <!-- Fonts & Stylesheet -->
  <link rel="stylesheet" href="./style.css">
  
  <!-- A-Frame WebXR Engine, Extras & Environment Component (Support Offline & Online) -->
  <script src="./vendor/aframe.min.js"></script>
  <script src="./vendor/aframe-environment-component.min.js"></script>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
</head>
<body>

  <!-- Loading Screen Overlay -->
  <div id="loader-overlay">
    <div class="spinner-ring"></div>
    <div class="loader-text">Memuat Objek 3D HOP JUMP...</div>
    <div class="loader-subtext">Menyiapkan dunia A-Frame VR</div>
  </div>

  <!-- A-Frame VR Canvas Container -->
  <div id="scene-container">
    <a-scene 
      embedded 
      renderer="antialias: true; colorManagement: true; exposure: 1.2; highRefreshRate: true"
      vr-mode-ui="enabled: false">
      
      <!-- Asset Manager -->
      <a-assets>
        <a-asset-item id="hopJumpAsset" src="./3D%20Asset/HOP%20JUMP.glb"></a-asset-item>
      </a-assets>

      <!-- VR Environment Skybox & Ground -->
      <a-entity id="env-entity" environment="preset: neon; skyType: atmosphere; lighting: point; groundColor: #090a0f; grid: glowing; gridColor: #00f0ff"></a-entity>

      <!-- Pedestal / Showcase Base -->
      <a-entity id="pedestal-group" position="0 0 -4">
        <!-- Outer Glowing Ring -->
        <a-cylinder position="0 0.05 0" radius="2.6" height="0.1" color="#0e121d" material="roughness: 0.2; metalness: 0.8"></a-cylinder>
        <a-ring position="0 0.11 0" rotation="-90 0 0" radius-inner="2.3" radius-outer="2.5" color="#00f0ff" material="emissive: #00f0ff; emissiveIntensity: 0.8"></a-ring>
        <!-- Inner Pedestal -->
        <a-cylinder position="0 0.2 0" radius="2" height="0.2" color="#161b26" material="roughness: 0.3; metalness: 0.9"></a-cylinder>
        <a-ring position="0 0.31 0" rotation="-90 0 0" radius-inner="1.7" radius-outer="1.9" color="#7000ff" material="emissive: #7000ff; emissiveIntensity: 0.6"></a-ring>
      </a-entity>

      <!-- Lighting Setup -->
      <a-entity id="ambient-light" light="type: ambient; color: #a0b0d0; intensity: 0.6"></a-entity>
      <a-entity id="spotlight" light="type: spot; color: #00f0ff; intensity: 2.5; angle: 45; penumbra: 0.5" position="0 6 -2" target="#hop-jump-model"></a-entity>
      <a-entity id="fill-light" light="type: point; color: #ff007b; intensity: 1.2; distance: 10" position="-3 3 -2"></a-entity>

      <!-- HOP JUMP 3D Model with Animation Mixer -->
      <a-entity 
        id="hop-jump-model" 
        gltf-model="#hopJumpAsset" 
        animation-mixer="clip: *; loop: repeat; timeScale: 1"
        position="0 0.3 -4" 
        scale="1 1 1"
        rotation="0 0 0">
      </a-entity>

      <!-- Camera Rig with Orbit & Smooth Transition Support -->
      <a-entity id="camera-rig" position="0 1.8 0.5" rotation="0 0 0">
        <a-camera id="main-camera" look-controls="pointerLockEnabled: false" wasd-controls="fly: false">
          <!-- Cursor for VR Interaction -->
          <a-cursor 
            id="vr-cursor"
            fuse="true" 
            fuse-timeout="1500" 
            color="#00f0ff"
            scale="0.8 0.8 0.8"
            animation__click="property: scale; startEvents: click; easing: easeInCubic; durability: 150; from: 0.1 0.1 0.1; to: 0.8 0.8 0.8"
            animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; durability: 1500; from: 0.8 0.8 0.8; to: 0.2 0.2 0.2">
          </a-cursor>
        </a-camera>
      </a-entity>

    </a-scene>
  </div>

  <!-- Main Logic JavaScript -->
  <script type="module" src="./main.js"></script>
</body>
</html>
